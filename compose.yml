# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
# Allow to run tests localy against known crystal release:
#
#    podman compose up crystal-1.21
#    podman compose up crystal-1.19
#    podman compose up crystal-1.16

x-crystal-test: &crystal-test
  build:
    context: .
    dockerfile: Containerfile.test
  volumes:
    - .:/app
  working_dir: /app
  command: crystal spec

services:
  crystal-1.22:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.22.2-alpine"
  crystal-1.21:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.21.1"
  crystal-1.20:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.20.3"
  crystal-1.19:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.19.2"
  crystal-1.18:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.18.2"
  crystal-1.17:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.17.1"
  crystal-1.16:
    <<: *crystal-test
    build:
      context: .
      dockerfile: Containerfile.test
      args:
        CRYSTAL_VERSION: "1.16.3"
